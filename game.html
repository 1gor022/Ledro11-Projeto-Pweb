<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Jogo - GameReview</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"></head>
<body>

    <header>
        <div class="container">
            <h1>GameReview Central</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="add-game.html">Adicionar Jogo</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="game-hero" id="hero-bg" style="background-image: url('https://via.placeholder.com/1200x400');">
        <div class="game-hero-content container">
            <div class="game-info">
                <h1 id="game-title">Carregando jogo...</h1>
                
                <div class="rating" id="game-rating" data-score="0"></div>
            </div>
        </div>
    </div>

    <main class="container">
        <section class="game-details">
            <div class="game-description">
                <h3>Nosso Veredito</h3>
                <p id="game-description">Buscando informações no servidor...</p>
            </div>

            <div class="comments-section">
                <h3>Comentários da Comunidade</h3>
                
                <form class="comment-form">
                    <div class="form-group">
                        <input type="text" placeholder="Seu Nome" required>
                    </div>
                    <div class="form-group">
                        <textarea placeholder="Escreva seu comentário..." required style="min-height: 60px;"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Publicar Comentário</button>
                </form>

                <div id="comments-list">
                    <div class="comment">
                        <div class="comment-header">
                            <span class="comment-author">Sistema</span>
                            <span class="comment-date">Agora</span>
                        </div>
                        <p>Os comentários ainda são ilustrativos, mas o jogo acima veio do Banco de Dados!</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 GameReview Central.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
