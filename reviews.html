<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todas as Reviews - GameReview</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>GameReview Central</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="reviews.html" class="active">Reviews</a></li>
                    <li><a href="add-game.html">Adicionar Jogo</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 40px;">
        <div class="page-header">
            <h2>Todas as Análises</h2>
            <p>Confira a opinião detalhada dos nossos críticos sobre os últimos lançamentos.</p>
        </div>

        <div class="reviews-list-container" id="reviews-container">
            <div class="loading-spinner"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 GameReview Central.</p>
        </div>
    </footer>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Excluir Jogo?</h3>
            <p>Essa ação não pode ser desfeita. Tem certeza?</p>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-modal btn-confirm" id="modal-confirm">Sim, Excluir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
